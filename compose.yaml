name: trial-magica-backend

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    # Local development only; never reuse these credentials for hosted databases.
    environment:
      POSTGRES_USER: magica
      POSTGRES_PASSWORD: magica_local_only
      POSTGRES_DB: magica_trial
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18 stores its versioned data directory beneath this mount.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    shm_size: 128mb

volumes:
  postgres_data:
